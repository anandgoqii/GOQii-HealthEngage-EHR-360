  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 14px; font-weight: 500; color: #E2E8F0; } .he-contact-link:hover { color: #2BC48A; } .he-contact-icon { width: 16px; height: 16px; color: #2BC48A; flex-shrink: 0; display: block; } .he-form { background: #FFFFFF; color: #0F172A; border: 1px solid #E8EDF2; border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 40px rgba(11, 18, 32, 0.42); } .he-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .he-field { display: flex; flex-direction: column; gap: 5px; } .he-label { font-size: 12px; font-weight: 600; color: #0F172A; } .he-input, .he-select { width: 100%; height: 40px; border-radius: 10px; border: 1px solid #E8EDF2; padding: 0 12px; font-size: 14px; font-family: inherit; color: #0F172A; background: #F8FAFB; transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease; } .he-select { padding: 0 10px; } .he-input:focus, .he-select:focus { background: #FFFFFF; border-color: #2BC48A; box-shadow: 0 0 0 3px rgba(43, 196, 138, 0.18); outline: none; } /* Footer */ .he-footer { background: #FFFFFF; color: #64748B; border-top: 1px solid #E8EDF2; } .he-footer-inner { max-width: 1200px; margin: 0 auto; padding: 36px 24px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; } .he-footer-logos { display: flex; align-items: center; } .he-footer-logo { height: 42px; width: auto; max-width: 186px; object-fit: contain; display: block; } .he-footer-links { display: flex; gap: 24px; font-size: 14px; font-weight: 500; flex-wrap: wrap; } .he-footer-link { color: #0F172A; } .he-footer-link:hover { color: #16855C; } /* Responsive Breakpoints */ @media (max-width: 1080px) { .he-grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .he-int-writeback { grid-column: 1 / -1; } } @media (max-width: 1024px) { .he-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .he-header-inner { gap: 14px; } .he-nav { gap: 16px; } } @media (max-width: 960px) { .he-hero-inner { grid-template-columns: 1fr; gap: 36px; padding: 126px 24px 60px; } .he-locker-inner { grid-template-columns: 1fr; gap: 40px; padding: 64px 24px; } .he-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .he-roi-grid-3, .he-problem-grid-3 { grid-template-columns: 1fr; } .he-roi-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; } .he-refs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .he-demo-inner { grid-template-columns: 1fr; gap: 32px; padding: 48px 24px; } .he-form { max-width: 520px; width: 100%; } } @media (max-width: 768px) { .he-container { padding: 56px 20px; gap: 28px; } .he-container-tight { padding-top: 48px; padding-bottom: 48px; } .he-footer-inner { flex-direction: column; align-items: flex-start; } } @media (max-width: 640px) { .he-top-wrap { padding: 10px 14px 0; } .he-header { border-radius: 14px; } .he-header-inner { padding: 10px 16px; gap: 10px; } .he-brand-group { gap: 10px; } .he-logo-brand { height: 36px; max-width: 166px; } .he-nav { width: 100%; gap: 8px 14px; font-size: 13px; } .he-btn-nav { margin-left: auto; padding: 8px 14px; font-size: 13px; } .he-hero-inner { padding: 148px 18px 48px; } .he-locker-inner { padding: 44px 18px; } .he-demo-inner { padding: 40px 18px; } .he-form-grid { grid-template-columns: 1fr; } .he-proof-bar { grid-template-columns: 1fr; gap: 14px; } .he-grid-3, .he-grid-4, .he-grid-5 { grid-template-columns: 1fr; } .he-int-writeback { grid-column: auto; } .he-biomarkers { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } .he-biomarker-tile, .he-biomarker-tile-ok { padding: 10px; } .he-biomarker-val, .he-biomarker-val-green { font-size: 18px; } .he-action-banner { flex-direction: column; align-items: flex-start; } .he-locker-cards { grid-template-columns: 1fr; } .he-roi-banner { padding: 22px 18px; } .he-refs-grid { grid-template-columns: 1fr; gap: 14px; } .he-form { padding: 22px 18px; } } @media (max-width: 460px) { .he-roi-kpis { grid-template-columns: 1fr; } .he-cta-row > a { width: 100%; } }<\u002Fstyle><\u002Fhelmet><div class=\"he-page\" data-canvas-width=\"1280\" data-canvas-height=\"6400\" data-document-role=\"page\" data-label=\"EHR 360 marketing page · desktop\"><div class=\"he-top-wrap\"><header class=\"he-header\"><div class=\"he-header-inner\"><div class=\"he-brand-group\"><img src=\"https://appcdn.goqii.com/storeimg/57690_1794907093.png\" alt=\"GOQii HealthEngage\" class=\"he-logo-brand\"><\u002Fdiv><nav class=\"he-nav\"><a href=\"#how\" class=\"he-nav-link\">How it works<\u002Fa><a href=\"#modules\" class=\"he-nav-link\">Modules<\u002Fa><a href=\"#locker\" class=\"he-nav-link\">Patient locker<\u002Fa><a href=\"#roi\" class=\"he-nav-link\">Provider ROI<\u002Fa><a href=\"#integration\" class=\"he-nav-link\">Integration<\u002Fa><a href=\"#trust\" class=\"he-nav-link\">Trust<\u002Fa><a href=\"#demo\" class=\"he-btn-primary he-btn-nav\">Book a demo<\u002Fa><\u002Fnav><\u002Fdiv><\u002Fheader><\u002Fdiv><section class=\"he-hero-section\"><div class=\"he-hero-inner\"><div class=\"he-hero-copy\"><p class=\"he-eyebrow\"><span class=\"he-dot\"><\u002Fspan>GOQii HealthEngage EHR 360<\u002Fp><h1 class=\"he-h1\">One patient record. Smarter care. Measurable outcomes.<\u002Fh1><p class=\"he-hero-lead\">EHR 360 unifies patient data from HIS, labs, claims and health IDs into actionable insights, connecting patients to bookings, outreach and coaching.<\u002Fp><div class=\"he-cta-row\"><a href=\"#demo\" class=\"he-btn-primary he-btn-hero\">Book a 30-minute demo<\u002Fa><a href=\"#locker\" class=\"he-btn-secondary\">See the patient experience<\u002Fa><\u002Fdiv><div class=\"he-proof-bar\"><div class=\"he-proof-item\"><span class=\"he-proof-title\">India · KSA · UAE<\u002Fspan><span class=\"he-proof-sub\">In-country hosting in each market<\u002Fspan><\u002Fdiv><div class=\"he-proof-item\"><span class=\"he-proof-title\">Arabic + English<\u002Fspan><span class=\"he-proof-sub\">Hindi, Urdu, Malayalam, Tagalog next<\u002Fspan><\u002Fdiv><div class=\"he-proof-item\"><span class=\"he-proof-title\">Bupa Arabia · NEOM · NHS<\u002Fspan><span class=\"he-proof-sub\">GOQii engagement references<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"he-hero-card\"><div class=\"he-hero-card-bar\"><\u002Fdiv><span class=\"he-card-kicker\"><span class=\"he-dot\"><\u002Fspan>Smart Report · demo data<\u002Fspan><span class=\"he-hero-card-title\">Full body blood panel<\u002Fspan><p class=\"he-hero-card-desc\">Your blood sugar control has slipped into the pre-diabetes range and LDL cholesterol is above target. Thyroid, kidney and liver markers are normal.<\u002Fp><div class=\"he-biomarkers\"><div class=\"he-biomarker-tile\"><span class=\"he-biomarker-label\">HbA1c<\u002Fspan><span class=\"he-biomarker-val\">6.4%<\u002Fspan><\u002Fdiv><div class=\"he-biomarker-tile\"><span class=\"he-biomarker-label\">LDL<\u002Fspan><span class=\"he-biomarker-val\">148<\u002Fspan><\u002Fdiv><div class=\"he-biomarker-tile-ok\"><span class=\"he-biomarker-label\">TSH<\u002Fspan><span class=\"he-biomarker-val-green\">2.1<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"he-action-banner\"><span style=\"font-size: 13px; font-weight: 600; color: #0F172A\">Endocrinology review · Thu 10:30<\u002Fspan><span class=\"he-action-pill\">Book<\u002Fspan><\u002Fdiv><span style=\"font-size: 12px; color: #64748B\">Supports, and does not replace, your doctor’s advice.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsection><section style=\"background: #FFFFFF; border-bottom: 1px solid #E8EDF2\"><div class=\"he-container\"><h2 class=\"he-h2\" style=\"max-width: 780px\">Your systems already hold the data. Nobody acts on it.<\u002Fh2><div class=\"he-grid-3 he-problem-grid-3\"><div class=\"he-card-surface\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/><line x1=\"9\" y1=\"15\" x2=\"15\" y2=\"15\"/><line x1=\"9\" y1=\"11\" x2=\"11\" y2=\"11\"/><\u002Fsvg><\u002Fspan><span class=\"he-problem-title\">PDFs<\u002Fspan><span class=\"he-problem-body\">Lab results leave as files. An abnormal value and a normal one look identical to the patient, and neither becomes an appointment.<\u002Fspan><\u002Fdiv><div class=\"he-card-surface\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/><\u002Fsvg><\u002Fspan><span class=\"he-problem-title\">Silence<\u002Fspan><span class=\"he-problem-body\">Discharged patients are not called, chronic members are not coached, and renewals churn with nobody noticing until the loss ratio moves.<\u002Fspan><\u002Fdiv><div class=\"he-card-surface\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polygon points=\"12 2 2 7 12 12 22 7 12 2\"/><polyline points=\"2 17 12 22 22 17\"/><polyline points=\"2 12 12 17 22 12\"/><\u002Fsvg><\u002Fspan><span class=\"he-problem-title\">Three apps<\u002Fspan><span class=\"he-problem-body\">A caregiver managing a parent and a child holds records across hospitals, labs and national portals, in languages the family does not all share.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"how\" style=\"background: #F8FAFB\"><div class=\"he-container\"><div class=\"he-section-head\"><p class=\"he-eyebrow\"><span class=\"he-dot\"><\u002Fspan>How it works<\u002Fp><h2 class=\"he-h2\">Read. Explain. Act. Prove.<\u002Fh2><\u002Fdiv><div class=\"he-grid-4\"><div class=\"he-card\"><span class=\"he-step-badge\">01<\u002Fspan><h3 class=\"he-card-h3\">Read every source<\u002Fh3><p class=\"he-card-body\">HIS, LIS, claims, ABHA, Emirates ID and Iqama routes, HIEs through your licence, patient scans and wearables, de-duplicated and coded into one longitudinal record.<\u002Fp><div class=\"he-step-bar\"><div class=\"he-step-bar-fill\" style=\"width: 25%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"he-card\"><span class=\"he-step-badge\">02<\u002Fspan><h3 class=\"he-card-h3\">Explain to the patient<\u002Fh3><p class=\"he-card-body\">A clinically reviewed content library and rules produce a plain-language Smart Report, trends, a health score and a grounded copilot, at the reader’s literacy level and language.<\u002Fp><div class=\"he-step-bar\"><div class=\"he-step-bar-fill\" style=\"width: 50%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"he-card\"><span class=\"he-step-badge\">03<\u002Fspan><h3 class=\"he-card-h3\">Act and close the loop<\u002Fh3><p class=\"he-card-body\">Care actions book into your schedule, Reach calls or messages the patient in their language, coordinators work a prioritised queue, GOQii coaches take the chronic cases. Outcomes write back.<\u002Fp><div class=\"he-step-bar\"><div class=\"he-step-bar-fill\" style=\"width: 75%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"he-card\"><span class=\"he-step-badge\">04<\u002Fspan><h3 class=\"he-card-h3\">Prove the return<\u002Fh3><p class=\"he-card-body\">The Opportunity Engine scores your patient or member base; the ROI view counts only completed, billed encounters, by segment, specialty and channel.<\u002Fp><div class=\"he-step-bar\"><div class=\"he-step-bar-fill\" style=\"width: 100%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"modules\" style=\"background: #FFFFFF; border-top: 1px solid #E8EDF2\"><div class=\"he-container\"><div class=\"he-section-head\"><p class=\"he-eyebrow\"><span class=\"he-dot\"><\u002Fspan>Modules<\u002Fp><h2 class=\"he-h2\">Six modules, deployed together or one at a time<\u002Fh2><\u002Fdiv><div class=\"he-grid-3\"><div class=\"he-card-surface\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M21 12c0 1.66-4 3-9 3s-9-1.34-9-3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><\u002Fsvg><\u002Fspan><h3 class=\"he-card-h3\">Longitudinal Record<\u002Fh3><p class=\"he-card-body\">Household and profiles, LOINC-coded biomarkers, consent and provenance on every value, FHIR R4 store and export.<\u002Fp><\u002Fdiv><div class=\"he-card-surface\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\" ry=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/><\u002Fsvg><\u002Fspan><h3 class=\"he-card-h3\">Smart Health Locker<\u002Fh3><p class=\"he-card-body\">The patient and family app: Smart Report, trends, care actions, connected sources and national ID linking, white-labelled to your brand.<\u002Fp><\u002Fdiv><div class=\"he-card-surface\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1m0-12.8l-2.1 2.1m-8.6 8.6l-2.1 2.1\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><\u002Fsvg><\u002Fspan><h3 class=\"he-card-h3\">Insight Engine<\u002Fh3><p class=\"he-card-body\">Curated content for 1,000+ biomarkers, guideline rules by age and sex, narrative generation, Health Copilot, health score.<\u002Fp><\u002Fdiv><div class=\"he-card-surface\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><\u002Fsvg><\u002Fspan><h3 class=\"he-card-h3\">Opportunity Engine<\u002Fh3><p class=\"he-card-body\">No-show recovery, discharge follow-up, OP to IP conversion, leakage, chronic risk, screening gaps and renewal churn, each with a value estimate.<\u002Fp><\u002Fdiv><div class=\"he-card-surface\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"/><\u002Fsvg><\u002Fspan><h3 class=\"he-card-h3\">Engagement and Action<\u002Fh3><p class=\"he-card-body\">Reach AI voice and WhatsApp on your numbers, Coordinator Console, slot booking, home sample, coaching enrolment, outcome write-back.<\u002Fp><\u002Fdiv><div class=\"he-card-navy\"><span class=\"he-icon-badge-dark\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"10\"/><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"14\"/><\u002Fsvg><\u002Fspan><h3 class=\"he-card-h3-white\">Executive and Insurer Views<\u002Fh3><p class=\"he-card-body-dark\">Identified vs converted value, retention, compliance, loss-ratio contribution, audit export. The screen your CFO opens.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"locker\" class=\"he-locker-section\"><div class=\"he-locker-inner\"><div class=\"he-locker-copy\"><p class=\"he-eyebrow-dark\"><span class=\"he-dot\"><\u002Fspan>Smart Health Locker<\u002Fp><h2 class=\"he-h2-white\">Every result explained. Every follow-up booked. The whole family in one place.<\u002Fh2><ul class=\"he-locker-list\"><li>Plain-language Smart Report with linked-marker patterns, in simple, standard or clinical mode<\u002Fli><li>Health Copilot that answers questions about the patient’s own record and hands off to a coach or a booking<\u002Fli><li>Trends across years with reference bands; a transparent health score per profile<\u002Fli><li>Family profiles with caregiver access and age-appropriate rules for children and older parents<\u002Fli><li>Connect records from your hospital, ABHA, Emirates ID or Iqama routes, or a scanned report<\u002Fli><li>Care actions that book a slot, order a home sample or call a GOQii coach in one tap<\u002Fli><\u002Ful><div class=\"he-cta-row\"><a href=\"#demo\" class=\"he-btn-primary he-btn-locker\">Try a sample report<\u002Fa><span style=\"padding: 8px 0; font-size: 13px; color: #94A3B8\">Available in the GOQii app and as a white-labelled SDK<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"he-locker-cards\"><div class=\"he-locker-card\"><span style=\"font-size: 12px; color: #94A3B8\">Family home<\u002Fspan><span style=\"font-size: 15px; font-weight: 600; color: #FFFFFF\">Sachin · 72<\u002Fspan><span style=\"font-size: 15px; font-weight: 600; color: #FFFFFF\">Rekha · 81<\u002Fspan><span style=\"font-size: 15px; font-weight: 600; color: #FFFFFF\">Mother · 58<\u002Fspan><span style=\"font-size: 12px; font-weight: 500; color: #CBD5E1; margin-top: auto\">1 follow-up overdue<\u002Fspan><\u002Fdiv><div class=\"he-locker-card\"><span style=\"font-size: 12px; color: #94A3B8\">HbA1c trend<\u002Fspan><span style=\"font-size: 24px; font-weight: 700; color: #FFFFFF\">6.4%<\u002Fspan><span style=\"font-size: 12px; color: #CBD5E1\">5.4 → 5.6 → 5.9 → 6.4 since 2020<\u002Fspan><span style=\"font-size: 12px; font-weight: 600; color: #2BC48A; margin-top: auto\">Review recommended<\u002Fspan><\u002Fdiv><div class=\"he-locker-card\"><span style=\"font-size: 12px; color: #94A3B8\">Care action<\u002Fspan><span style=\"font-size: 15px; font-weight: 600; color: #FFFFFF\">Diabetes review · 4 weeks<\u002Fspan><span style=\"font-size: 12px; color: #CBD5E1\">Next slot Thu 10:30<\u002Fspan><span style=\"font-size: 12px; font-weight: 600; color: #2BC48A; margin-top: auto\">Book · Call a coach<\u002Fspan><\u002Fdiv><div class=\"he-locker-card\"><span style=\"font-size: 12px; color: #94A3B8\">Connected<\u002Fspan><span style=\"font-size: 15px; font-weight: 600; color: #FFFFFF\">Hospital HIS · live<\u002Fspan><span style=\"font-size: 15px; font-weight: 600; color: #FFFFFF\">Emirates ID · 11 records<\u002Fspan><span style=\"font-size: 12px; font-weight: 600; color: #2BC48A; margin-top: auto\">Consent valid to Mar 2027<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"roi\" style=\"background: #F8FAFB\"><div class=\"he-container\"><div class=\"he-section-head\"><p class=\"he-eyebrow\"><span class=\"he-dot\"><\u002Fspan>For hospitals, labs and insurers<\u002Fp><h2 class=\"he-h2\">Your CFO sees converted value, not promises<\u002Fh2><\u002Fdiv><div class=\"he-grid-3 he-roi-grid-3\"><div class=\"he-card\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18\"/><path d=\"M5 21V7l8-4v18\"/><path d=\"M19 21V11l-6-4\"/><path d=\"M9 9h1\"/><path d=\"M9 13h1\"/><path d=\"M9 17h1\"/><\u002Fsvg><\u002Fspan><h3 class=\"he-card-h3\">Hospitals<\u002Fh3><p class=\"he-card-body\">No-show recovery, post-discharge follow-up within 7 days, OP to IP conversion, repeat and leakage recovery, documentation and follow-up compliance for inspections.<\u002Fp><span class=\"he-roi-metric\">Pilot target: 20% of identified value converted in 90 days<\u002Fspan><\u002Fdiv><div class=\"he-card\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><path d=\"M9 12l2 2 4-4\"/><\u002Fsvg><\u002Fspan><h3 class=\"he-card-h3\">Insurers and TPAs<\u002Fh3><p class=\"he-card-body\">Chronic member engagement with coaches, network steering at pre-authorisation, claims pattern alerts, renewal retention predicted 90 days out.<\u002Fp><span class=\"he-roi-metric\">Measured as loss-ratio points and premium retained<\u002Fspan><\u002Fdiv><div class=\"he-card\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6\"/><path d=\"M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3\"/><\u002Fsvg><\u002Fspan><h3 class=\"he-card-h3\">Labs and home care<\u002Fh3><p class=\"he-card-body\">Every report delivered as a Smart Report under your brand; repeat-test and screening reminders; home-sample booking; visit confirmation for home-care teams.<\u002Fp><span class=\"he-roi-metric\">Priced per active patient per month<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"he-roi-banner\"><div class=\"he-roi-banner-copy\"><span class=\"he-card-kicker-dark\"><span class=\"he-dot\"><\u002Fspan>Executive ROI view · demo data<\u002Fspan><span style=\"font-size: 19px; font-weight: 600; line-height: 1.35; color: #FFFFFF\">Identified vs converted, by month and segment<\u002Fspan><\u002Fdiv><div class=\"he-roi-kpis\"><div class=\"he-kpi-navy\"><span style=\"font-size: 12px; color: #94A3B8\">Identified<\u002Fspan><span class=\"he-kpi-val\">AED 42.5M<\u002Fspan><\u002Fdiv><div class=\"he-kpi-green\"><span style=\"font-size: 12px; font-weight: 600; color: #0F172A\">Converted<\u002Fspan><span class=\"he-kpi-val\">AED 9.8M<\u002Fspan><\u002Fdiv><div class=\"he-kpi-navy\"><span style=\"font-size: 12px; color: #94A3B8\">No-show rate<\u002Fspan><span class=\"he-kpi-val\">18% → 13%<\u002Fspan><\u002Fdiv><div class=\"he-kpi-navy\"><span style=\"font-size: 12px; color: #94A3B8\">7-day follow-up<\u002Fspan><span class=\"he-kpi-val\">83%<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"integration\" style=\"background: #FFFFFF; border-top: 1px solid #E8EDF2; border-bottom: 1px solid #E8EDF2\"><div class=\"he-container\"><div class=\"he-section-head\"><p class=\"he-eyebrow\"><span class=\"he-dot\"><\u002Fspan>Integration and identity<\u002Fp><h2 class=\"he-h2\">Reads what you have. Writes back what it does.<\u002Fh2><\u002Fdiv><div class=\"he-grid-5\"><div class=\"he-card-surface he-int-card\"><span class=\"he-int-kicker\">Sources<\u002Fspan><span class=\"he-card-body\" style=\"color: #0F172A\">HIS and LIS via HL7 v2 and FHIR R4 · claims via NPHIES and eClaimLink · nightly file fallback<\u002Fspan><\u002Fdiv><div class=\"he-card-surface he-int-card\"><span class=\"he-int-kicker\">India<\u002Fspan><span class=\"he-card-body\" style=\"color: #0F172A\">ABHA linking as an ABDM Health Information User with consent-manager flows and FHIR bundles<\u002Fspan><\u002Fdiv><div class=\"he-card-surface he-int-card\"><span class=\"he-int-kicker\">UAE<\u002Fspan><span class=\"he-card-body\" style=\"color: #0F172A\">Emirates ID identity; NABIDH, Malaffi and Riayati records through your facility licence<\u002Fspan><\u002Fdiv><div class=\"he-card-surface he-int-card\"><span class=\"he-int-kicker\">KSA<\u002Fspan><span class=\"he-card-body\" style=\"color: #0F172A\">Iqama and National ID via Nafath; provider HIS and NPHIES feeds; Sehhaty route on request<\u002Fspan><\u002Fdiv><div class=\"he-card-navy he-int-card he-int-writeback\"><span class=\"he-int-kicker-dark\">Write-back<\u002Fspan><span class=\"he-card-body-dark\" style=\"color: #FFFFFF\">FHIR Appointment and Encounter out; webhooks for result-ready, action-taken and booking events<\u002Fspan><\u002Fdiv><\u002Fdiv><p class=\"he-muted-note\">Telephony on Cisco Call Manager or Twilio with your numbers; WhatsApp Business API; booking via your HIS scheduling API or a booking partner, with Reach callback as the fallback.<\u002Fp><\u002Fdiv><\u002Fsection><section id=\"trust\" style=\"background: #F8FAFB\"><div class=\"he-container\"><div class=\"he-section-head\"><p class=\"he-eyebrow\"><span class=\"he-dot\"><\u002Fspan>Trust<\u002Fp><h2 class=\"he-h2\">Built for regulated care<\u002Fh2><\u002Fdiv><div class=\"he-grid-4\"><div class=\"he-card\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"/><polyline points=\"22 4 12 14.01 9 11.01\"/><\u002Fsvg><\u002Fspan><span class=\"he-card-h3\" style=\"font-size: 16px\">Clinically governed<\u002Fspan><span class=\"he-card-body\">Reviewed content library and guideline rules; every insight cites its source record and rule; no diagnosis or prescribing anywhere.<\u002Fspan><\u002Fdiv><div class=\"he-card\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/><\u002Fsvg><\u002Fspan><span class=\"he-card-h3\" style=\"font-size: 16px\">In-country data<\u002Fspan><span class=\"he-card-body\">Hosted in India, KSA and UAE respectively; on-premise option for large groups; no cross-border replication of identified data.<\u002Fspan><\u002Fdiv><div class=\"he-card\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\" ry=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/><\u002Fsvg><\u002Fspan><span class=\"he-card-h3\" style=\"font-size: 16px\">Consent and audit<\u002Fspan><span class=\"he-card-body\">Consent per channel and per profile; revocation honoured within the hour; full audit of every read, insight, call and booking.<\u002Fspan><\u002Fdiv><div class=\"he-card\"><span class=\"he-icon-badge\"><svg class=\"he-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><path d=\"M9 12l2 2 4-4\"/><\u002Fsvg><\u002Fspan><span class=\"he-card-h3\" style=\"font-size: 16px\">Standards<\u002Fspan><span class=\"he-card-body\">HIPAA and GDPR aligned; DPDP, PDPL and UAE health data law; ISO 27001 programme; ISO 15189-aligned processes for labs.<\u002Fspan><\u002Fdiv><\u002Fdiv><p class=\"he-footnote\">EHR 360 is not a diagnostic device. Recommendations support, and do not replace, a clinician’s advice. Screens on this page use demo data.<\u002Fp><\u002Fdiv><\u002Fsection><section style=\"background: #FFFFFF; border-top: 1px solid #E8EDF2\"><div class=\"he-container he-container-tight\" style=\"gap: 24px; align-items: center; text-align: center\"><p class=\"he-eyebrow\"><span class=\"he-dot\"><\u002Fspan>GOQii engagement, in production<\u002Fp><div class=\"he-refs-grid\"><div class=\"he-ref-item\"><span class=\"he-ref-name\">Bupa Arabia<\u002Fspan><span class=\"he-ref-sub\">Member engagement, KSA<\u002Fspan><\u002Fdiv><div class
